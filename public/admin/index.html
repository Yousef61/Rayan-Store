<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>لوحة التحكم | Rayan Store</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <form class="panel" id="loginForm">
      <img src="/img/logo.svg" alt="" width="56" height="56" style="margin:0 auto">
      <h2>لوحة تحكم Rayan Store</h2>
      <div class="field"><label for="pw">كلمة السر</label><input type="password" id="pw" required autocomplete="current-password"></div>
      <div class="error" id="loginError" hidden></div>
      <button class="btn block">دخول</button>
    </form>
  </section>

  <div id="dash" hidden>
    <header class="admin-header">
      <div class="container header-row">
        <a class="brand" href="/admin"><img src="/img/logo.svg" alt="" width="36" height="36"><span><b>لوحة التحكم</b></span></a>
        <nav class="tabs" id="tabs">
          <button data-tab="orders" class="active">📦 الطلبات <span class="badge inline" id="newBadge" hidden></span></button>
          <button data-tab="products">🛍️ المنتجات</button>
          <button data-tab="categories">🗂️ الأقسام</button>
          <button data-tab="settings">⚙️ الإعدادات</button>
        </nav>
        <div class="header-actions">
          <a class="btn sm outline" href="/" target="_blank">عرض المتجر</a>
          <button class="btn sm outline" id="logoutBtn">خروج</button>
        </div>
      </div>
    </header>
    <main class="container" id="view"></main>
  </div>

  <dialog id="dialog"><div id="dialogBody"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
