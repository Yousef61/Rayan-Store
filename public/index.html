<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rayan Store | شنط مدارس وحضانة وطرح وبندانات</title>
  <meta name="description" content="Rayan Store - شنط مدارس، شنط حضانة، طرح وبندانات. الدفع عند الاستلام والتوصيل لكل المحافظات.">
  <meta name="theme-color" content="#d6336c">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announce" id="announce" hidden></div>

  <header class="site-header">
    <div class="container header-row">
      <a href="#/" class="brand">
        <img src="/img/logo.svg" alt="" width="40" height="40">
        <span><b id="storeName">Rayan Store</b><small id="tagline"></small></span>
      </a>
      <form class="search" id="searchForm" role="search">
        <input type="search" id="searchInput" placeholder="ابحث عن شنطة، طرحة، بندانة..." aria-label="بحث">
        <button aria-label="بحث">🔍</button>
      </form>
      <a href="#/cart" class="cart-btn" aria-label="السلة">
        🛍️ <span class="badge" id="cartCount">0</span>
      </a>
    </div>
    <nav class="container cats-nav" id="catsNav"></nav>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <b>Rayan Store</b>
        <p>شنط مدارس وحضانة وطرح وبندانات بأحسن خامات وأحسن أسعار.</p>
      </div>
      <div id="contactLinks"></div>
    </div>
    <p class="copy">© <span id="year"></span> Rayan Store</p>
  </footer>

  <a id="waFloat" class="wa-float" target="_blank" rel="noopener" hidden aria-label="واتساب">

  </a>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/js/app.js"></script>
</body>
</html>
